[pytest]
markers =
    unit: Unit tests (no external dependencies, mock ODPS)
    integration: Integration tests (require real ODPS connection)
    e2e: End-to-end tests (subprocess CLI invocation)
    eval: LLM-based skill evaluation (requires ANTHROPIC_API_KEY)
# pytest.ini is the effective config file for this repo, so the pythonpath option
# declared in pyproject.toml [tool.pytest.ini_options] is never read. Declare it
# here as well: `make test` must collect on a checkout that has not been
# `pip install -e .`-ed, otherwise every test module fails with
# ModuleNotFoundError: No module named 'maxc_cli'.
pythonpath = src
addopts = -m "not integration and not e2e and not eval"
testpaths = tests
