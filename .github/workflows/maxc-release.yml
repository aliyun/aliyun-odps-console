name: Release maxc binaries

# Builds the PyInstaller onedir on linux/darwin × amd64/arm64 + windows-amd64
# (five platforms), smoke-tests each bundle, uploads tarball + sha256 to OSS at
#   https://maxcompute-repo.oss-cn-hangzhou.aliyuncs.com/maxc-cli/{version}/{platform}/
# then atomically flips versions/latest only after all 5 succeed.
#
# windows-arm64 is intentionally excluded: pyodps ships no win_arm64 wheel and
# its Cython extensions cannot be built on the GitHub runner's mingw toolchain
# (numpy build dep fails). Re-add once upstream pyodps publishes an arm64 wheel.
#
# Pull requests validate release tooling using build-only runs. A manual run
# must explicitly opt in to production publishing. The version is read from
# src/maxc_cli/__init__.py (__version__) so it always matches what
# `maxc --version` prints. Unsigned preview builds can select another source SHA.
# Signed runs use the workflow's own source SHA. Limit maxc-macos-signing to
# approved release refs and keep the five Apple credentials in that environment.
#
# Bucket/region/prefix are NOT secrets (the bucket is public read-only on the
# internet); only the AK/SK pair is. We bake the bucket coords in here to
# match scripts/{build_release,upload_to_oss,publish_latest}.sh defaults and
# the Aone CI yaml in .aoneci/cli-publish.yaml.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maxc-release.yml'
      - 'scripts/build_release.sh'
      - 'scripts/build_macos_release.sh'
      - 'scripts/release.sh'
      - 'scripts/release_e2e/**'
      - 'scripts/regression_test.py'
      - 'pyproject.toml'
      - 'src/maxc_cli/__init__.py'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Build & test only; skip OSS upload + latest flip'
        required: false
        default: 'true'
      sign_macos:
        description: 'Sign and notarize macOS artifacts during a build-only run'
        required: false
        default: false
        type: boolean
      source_sha:
        description: 'Optional full commit SHA of the release source; defaults to the workflow ref'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_publish == 'false') && 'maxc-oss-publish' || format('maxc-preview-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  MAXC_RELEASE_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  OSS_BUCKET: maxcompute-repo
  OSS_REGION: cn-hangzhou
  OSS_PREFIX: maxc-cli

jobs:
  release-baseline:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.latest.outputs.version }}
      candidate: ${{ steps.latest.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAXC_RELEASE_SOURCE_SHA }}
          persist-credentials: false
      - name: Resolve the candidate and pin the public baseline
        id: latest
        run: |
          candidate=$(python3 -c "import runpy; print(runpy.run_path('src/maxc_cli/__init__.py')['__version__'])")
          baseline=$(curl -fsS --max-time 30 'https://maxcompute-repo.oss-cn-hangzhou.aliyuncs.com/maxc-cli/versions/latest')
          if [[ ! "$baseline" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Invalid public MaxC latest pointer' >&2
            exit 1
          fi
          printf 'version=%s\ncandidate=%s\n' "$baseline" "$candidate" >> "$GITHUB_OUTPUT"

  quality:
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAXC_RELEASE_SOURCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff build

      - name: Static and unit checks
        run: |
          ruff check src/ tests/
          python -m pytest -q
          python -m pytest -q -m e2e tests/test_help_version_e2e.py tests/test_e2e_smoke.py

      - name: Build and install wheel smoke
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall dist/maxc_cli-*.whl
          maxc --version
          maxc agent manifest --json | python -c "import json,sys; assert json.load(sys.stdin)['status'] == 'success'"

  windows-quality:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAXC_RELEASE_SOURCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      # Keep native commands in separate steps: pwsh otherwise reports only
      # the last native exit code and can hide failed unit tests.
      - name: Windows static checks
        run: ruff check src/ tests/

      - name: Windows unit tests
        run: python -m pytest -q

      - name: Windows CLI smoke tests
        run: python -m pytest -q -m e2e tests/test_help_version_e2e.py tests/test_e2e_smoke.py

  build-linux:
    needs: [quality, windows-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     platform: linux-amd64, docker_image: "quay.io/pypa/manylinux2014_x86_64" }
          - { runner: ubuntu-22.04-arm, platform: linux-arm64, docker_image: "quay.io/pypa/manylinux2014_aarch64" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAXC_RELEASE_SOURCE_SHA }}

      - name: Build in manylinux2014 container (glibc 2.17)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src \
            -e OUTPUT_DIR=/src/dist/release \
            ${{ matrix.docker_image }} \
            bash -c '
              set -euo pipefail

              # manylinux /opt/python is statically linked; PyInstaller
              # needs a shared libpython.  Use miniforge to get a
              # conda-built shared Python linked against this glibc.
              curl -fsSL "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-$(uname -m).sh" \
                -o /tmp/miniforge.sh
              bash /tmp/miniforge.sh -b -p /opt/miniforge >/dev/null
              export PATH="/opt/miniforge/bin:$PATH"
              conda create -y -p /opt/py311 python=3.11 -q >/dev/null

              export PATH="/opt/py311/bin:$PATH"
              export LD_LIBRARY_PATH="/opt/py311/lib:${LD_LIBRARY_PATH:-}"

              python -m pip install --upgrade pip -q
              python -m pip install --no-deps pyodps -q
              python -m pip install -e . --no-deps -q
              python -m pip install -r requirements-bundle.txt -q
              bash scripts/build_release.sh
              python -m pytest tests/test_pyinstaller_bundle.py -v
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxc-${{ matrix.platform }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [quality, windows-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel,   platform: darwin-amd64 }
          - { runner: macos-15,         platform: darwin-arm64 }
          - { runner: windows-2022,     platform: windows-amd64 }
    runs-on: ${{ matrix.runner }}
    environment: ${{ (startsWith(matrix.platform, 'darwin-') && github.event_name == 'workflow_dispatch' && (inputs.sign_macos || github.event.inputs.skip_publish == 'false')) && 'maxc-macos-signing' || 'maxc-binary-build' }}
    env:
      SIGN_MACOS: ${{ startsWith(matrix.platform, 'darwin-') && github.event_name == 'workflow_dispatch' && (inputs.sign_macos || github.event.inputs.skip_publish == 'false') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAXC_RELEASE_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify release source for macOS signing
        if: env.SIGN_MACOS == 'true'
        shell: bash
        run: |
          if [[ "$MAXC_RELEASE_SOURCE_SHA" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "ERR: signed builds must use the workflow's exact source commit" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up standalone CPython for macOS signing
        if: env.SIGN_MACOS == 'true'
        shell: bash
        run: |
          # Bundle libpython as a dylib so signing does not depend on
          # resources omitted from the runner's Python.framework.
          python -m pip install 'uv==0.12.9'
          python -m uv venv --python 3.11.16 --managed-python --seed "$RUNNER_TEMP/maxc-venv"
          printf '%s\n' "$RUNNER_TEMP/maxc-venv/bin" >> "$GITHUB_PATH"

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller pytest

      - name: Build release tarball
        if: env.SIGN_MACOS != 'true'
        shell: bash
        env:
          OUTPUT_DIR: dist/release
        run: bash scripts/build_release.sh

      - name: Build and notarize macOS release tarball
        if: env.SIGN_MACOS == 'true'
        shell: bash
        env:
          OUTPUT_DIR: dist/release
          MAXC_MACOS_CERTIFICATE_P12: ${{ secrets.MAXC_MACOS_CERTIFICATE_P12 }}
          MAXC_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MAXC_MACOS_CERTIFICATE_PASSWORD }}
          MAXC_MACOS_NOTARY_APPLE_ID: ${{ secrets.MAXC_MACOS_NOTARY_APPLE_ID }}
          MAXC_MACOS_NOTARY_TEAM_ID: ${{ secrets.MAXC_MACOS_NOTARY_TEAM_ID }}
          MAXC_MACOS_NOTARY_PASSWORD: ${{ secrets.MAXC_MACOS_NOTARY_PASSWORD }}
        run: bash scripts/build_macos_release.sh

      - name: Smoke test the bundle
        shell: bash
        run: python -m pytest tests/test_pyinstaller_bundle.py -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxc-${{ matrix.platform }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  command-e2e:
    name: All commands from the release CLI entry points
    needs: [release-baseline, build-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAXC_RELEASE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: maxc-linux-amd64
          path: bundle
      - name: Execute all commands through the Linux release binary
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.release-baseline.outputs.candidate }}
        run: |
          printf '%s  %s\n' "$(cat bundle/maxc.tar.gz.sha256)" bundle/maxc.tar.gz | sha256sum --check --strict -
          tar -xzf bundle/maxc.tar.gz -C bundle
          python scripts/regression_test.py --maxc bundle/maxc/maxc --expected-version "$CANDIDATE_VERSION" | tee bundle-command-e2e.json
      - name: Execute all commands through an installed wheel
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.release-baseline.outputs.candidate }}
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python -m venv "$RUNNER_TEMP/maxc-release-wheel"
          "$RUNNER_TEMP/maxc-release-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/maxc-release-wheel/bin/python" -m pip check
          python scripts/regression_test.py --maxc "$RUNNER_TEMP/maxc-release-wheel/bin/maxc" \
            --expected-version "$CANDIDATE_VERSION" | tee wheel-command-e2e.json
      - uses: actions/upload-artifact@v4
        with:
          name: maxc-python-release-dist
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxc-command-e2e
          path: '*-command-e2e.json'
          if-no-files-found: ignore

  upgrade-e2e:
    name: Install and upgrade (${{ matrix.platform }})
    needs: [release-baseline, build-linux, build]
    if: github.event_name != 'pull_request' || needs.release-baseline.outputs.candidate != needs.release-baseline.outputs.version
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, platform: linux-amd64 }
          - { runner: ubuntu-22.04-arm, platform: linux-arm64 }
          - { runner: macos-15-intel, platform: darwin-amd64 }
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: windows-2022, platform: windows-amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAXC_RELEASE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: maxc-${{ matrix.platform }}
          path: bundle
      - name: Check clean install, failed upgrade, and recovery
        shell: bash
        env:
          BASELINE_VERSION: ${{ needs.release-baseline.outputs.version }}
          CANDIDATE_VERSION: ${{ needs.release-baseline.outputs.candidate }}
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/release_e2e/upgrade.py --bundle-dir bundle --version "$CANDIDATE_VERSION" \
            --platform "$TEST_PLATFORM" --baseline-version "$BASELINE_VERSION" | tee upgrade-e2e.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxc-upgrade-e2e-${{ matrix.platform }}
          path: upgrade-e2e.json
          if-no-files-found: ignore

  publish:
    needs: [release-baseline, build-linux, build, command-e2e, upgrade-e2e]
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_publish == 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAXC_RELEASE_SOURCE_SHA }}

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil --version

      - name: Resolve VERSION
        id: ver
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$MAXC_RELEASE_SOURCE_SHA" ]; then
            echo "ERR: release checkout must match the selected commit SHA" >&2
            exit 1
          fi
          VERSION=$(python -c "import re,sys; m=re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', open('src/maxc_cli/__init__.py').read()); sys.stdout.write(m.group(1) if m else '')")
          if [ -z "${VERSION}" ]; then
            echo "ERR: could not parse __version__ from src/maxc_cli/__init__.py" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "==> publishing VERSION=${VERSION} from ${MAXC_RELEASE_SOURCE_SHA}"

      - name: Upload each platform
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          BASELINE_VERSION: ${{ needs.release-baseline.outputs.version }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          current=$(curl -fsS --max-time 30 'https://maxcompute-repo.oss-cn-hangzhou.aliyuncs.com/maxc-cli/versions/latest')
          if [[ "$current" != "$BASELINE_VERSION" ]]; then
            echo 'The public baseline changed during validation. Run the release checks again.' >&2
            exit 1
          fi
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            INPUT_DIR="./artifacts/maxc-${platform}" PLATFORM="${platform}" \
              bash scripts/upload_to_oss.sh
          done

      - name: Flip versions/latest
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: bash scripts/publish_latest.sh
