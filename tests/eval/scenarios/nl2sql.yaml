scenarios:
  - name: nl2sql_unknown_table
    description: |
      User asks: "How many students scored above average in math last year?"
      No specific table is named. The schema is california_schools.
    context:
      auth_status: authenticated
      project: education_workspace
      schema: california_schools
      tables:
        - name: frpm
          schema: california_schools
          columns: ["CDSCode", "Academic Year", "County Name", "District Name", "School Name"]
        - name: satscores
          schema: california_schools
          columns: ["cds", "sname", "NumTstTakr", "AvgScrRead", "AvgScrMath", "AvgScrWrite"]
    expected:
      required_commands:
        - "meta describe"
        - "--json"
      required_behaviors:
        - "checks the grain of the available tables; a school average and participant count cannot identify the number of individual students above average"
        - "asks for suitable student-level data if discovery does not establish it"
        - "does not invent column names"
      forbidden_patterns:
        - "FROM satscores WHERE"
        - "active_students"
      key_assertions:
        - "does not present a count of schools or test takers as the requested number of students"
    difficulty: hard
